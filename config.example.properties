# Copy this file to "config.properties" (same folder) and fill in your own values.
# config.properties is listed in .gitignore, so your passwords never go to GitHub.

# ---- MySQL database ----
db.url=jdbc:mysql://localhost:3306/masters
db.user=root
db.password=

# ---- E-mail (used for password recovery and attendance e-mails) ----
# For Gmail: turn on 2-Step Verification, then create an App Password
# at https://myaccount.google.com/apppasswords and paste it below.
mail.host=smtp.gmail.com
mail.port=587
mail.user=your-address@gmail.com
mail.password=your-16-character-app-password
mail.from=your-address@gmail.com
